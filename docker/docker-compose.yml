services:
  site-db-test:
    image: mariadb:11
    container_name: site_db_test
    restart: unless-stopped
    environment:
      # Placeholders — match includes/dbconnect-template.php SITE_DB_* defaults (not production names).
      MARIADB_ROOT_PASSWORD: changeme
      MARIADB_DATABASE: app_db
      MARIADB_USER: readonly_user
      MARIADB_PASSWORD: changeme
    ports:
      - "3307:3306"   # host:container — optional; for host-side tools / seeding
    volumes:
      - ./init:/docker-entrypoint-initdb.d:ro
      - site_test_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Apache + PHP serving the project tree (test changes without a live server).
  site-web:
    build: .
    container_name: site_web
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      SITE_DB_HOST: site-db-test
      SITE_DB_PORT: "3306"
      SITE_DB_NAME: app_db
      SITE_DB_USER: readonly_user
      SITE_DB_PASS: changeme
    volumes:
      # Project root (sibling of docker/) → Apache DocumentRoot
      - ..:/var/www/html
    depends_on:
      site-db-test:
        condition: service_healthy

volumes:
  site_test_data:
